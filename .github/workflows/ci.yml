name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Parse & lint (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::parse errors:"
              $errors | Select-Object -First 10 | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "OK $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Lint (fail on Error severity)
        shell: pwsh
        run: |
          $settings = Join-Path $PWD '.psscriptanalyzer.psd1'
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings $settings
          if (-not $results) { Write-Host 'No findings.'; exit 0 }
          $results | Format-Table RuleName, Severity, ScriptName, Line -AutoSize | Out-String | Write-Host
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          if ($errors.Count -gt 0) {
            Write-Host "::error::$($errors.Count) error-severity PSScriptAnalyzer finding(s)"
            exit 1
          }
          Write-Host 'Only warnings/information — CI passes.'
